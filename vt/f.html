<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"></head><body><pre id="o">loading</pre><script>
(async()=>{const o=document.getElementById('o');try{
const css=await (await fetch('https://fonts.googleapis.com/css2?family=Alexandria:wght@200..900&display=swap')).text();
const blocks=css.split('@font-face').filter(b=>b.includes('U+0600'));
const url=blocks[0].match(/url\((.*?)\)/)[1];
const buf=new Uint8Array(await (await fetch(url)).arrayBuffer());
let s='';for(let i=0;i<buf.length;i++)s+=String.fromCharCode(buf[i]);
const b=btoa(s);const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf))).map(x=>x.toString(16).padStart(2,'0')).join('');
o.textContent='LEN '+buf.length+' SHA '+h+'\nB64START\n'+b.match(/.{1,4000}/g).join('\n')+'\nB64END';
}catch(e){o.textContent='ERR '+e}})();
</script></body></html>
