<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=540">
<title>stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#000}
#stage{width:540px;height:960px;position:relative;overflow:hidden;font-family:"Cairo",sans-serif;color:#fff;
 background:radial-gradient(420px 360px at 75% 22%,rgba(185,162,255,.30),transparent 65%),radial-gradient(380px 320px at 12% 96%,rgba(242,138,58,.24),transparent 62%),linear-gradient(180deg,#15111F 0%,#1B1430 100%)}
.rings{position:absolute;inset:0;background:repeating-radial-gradient(circle at 72% 40%,rgba(255,255,255,.04) 0 1.5px,transparent 1.5px 38px)}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 44px}
.serif{font-family:"Amiri",serif}
.big{font-size:64px;line-height:1.35;font-weight:400}
.mid{font-size:40px;line-height:1.5}
.or{color:#FFB36B}
.kick{color:#FFB36B;font-weight:700;letter-spacing:.24em;font-size:17px;display:flex;align-items:center;gap:12px}
.kick:before,.kick:after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,#FFB36B)}
.kick:after{transform:scaleX(-1)}
.line{width:64px;height:2px;background:#F28A3A;border-radius:2px;margin:26px auto}
/* goals */
.gh{position:absolute;top:70px;inset-inline:34px}
.gh h2{font-family:"Amiri",serif;font-weight:700;font-size:46px;line-height:1.2;margin-top:6px}
.cards{position:absolute;top:220px;inset-inline:34px;display:flex;flex-direction:column;gap:18px}
.g{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:22px;padding:20px 22px;border-top:4px solid var(--ac)}
.tp{display:flex;gap:8px;margin-bottom:8px}
.ap{font-size:13px;font-weight:800;padding:2px 12px;border-radius:999px;background:color-mix(in srgb,var(--ac) 26%,transparent)}
.pl{font-size:13px;font-weight:700;padding:2px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75)}
.g h4{font-size:22px;font-weight:800;margin-bottom:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:rgba(255,255,255,.65)}
.d b{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:13px;color:#1E1430}
.d.on b{background:var(--ac);border-color:var(--ac)}
.st{display:flex;justify-content:space-between;font-size:14px;color:rgba(255,255,255,.7);margin-top:10px}.st b{color:#fff}
.num{font-weight:900;font-size:34px;line-height:1.1}.num small{font-size:15px;color:rgba(255,255,255,.55);font-weight:700}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac);border-radius:inherit}
.steps{display:flex;flex-direction:column;gap:6px}
.s{display:flex;align-items:center;gap:10px;font-size:16px}
.s b{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;color:#1E1430}
.s.on{color:rgba(255,255,255,.5);text-decoration:line-through}.s.on b{background:var(--ac);border-color:var(--ac)}
.done{position:absolute;inset-inline-start:22px;top:18px;font-size:13px;font-weight:800;color:#1E1430;background:#FFB36B;border-radius:999px;padding:2px 12px}
.g{position:relative}
/* hero */
.hq{margin-top:46px;width:360px;padding:30px 26px 26px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 60px rgba(0,0,0,.3)}
.hq img{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;border:2px solid #FFB36B;box-shadow:0 0 0 7px rgba(255,179,107,.13),0 12px 30px rgba(0,0,0,.45)}
.hq p{font-family:"Amiri",serif;font-weight:700;font-size:34px;color:#FFB36B;line-height:1.4}
.hq cite{display:block;font-style:normal;font-size:14px;color:rgba(255,255,255,.55);margin-top:10px}
.logo{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,#FFB36B,#F28A3A);color:#1E1430;display:grid;place-items:center;font-weight:900;font-size:40px;margin:0 auto 28px;box-shadow:0 20px 50px rgba(242,138,58,.35)}
.cta{margin-top:34px;font-weight:800;font-size:19px;letter-spacing:.06em;border:1px solid rgba(255,179,107,.6);color:#FFB36B;border-radius:999px;padding:10px 26px}
</style>
</head>
<body>
<div id="stage"><div class="rings"></div><div class="stars" id="stars"></div><div id="sc"></div></div>
<script>
const st=document.getElementById('stars');let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=r()*540+'px';e.style.top=r()*960+'px';e.style.opacity=(.2+r()*.6).toFixed(2);if(r()>.85){e.style.width=e.style.height='3px'}st.appendChild(e)}
const S=new URLSearchParams(location.search).get('s')||'1';
const days=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const habit=(on)=>`<div class="days">${days.map((d,i)=>`<div class="d ${i<on?'on':''}"><span>${d}</span><b>${i<on?'✓':''}</b></div>`).join('')}</div>`;
const steps=(n)=>`<div class="steps">${['اختيار الدورة','التسجيل','إنهاء الوحدات','مشروع التخرج'].map((s,i)=>`<div class="s ${i<n?'on':''}"><b>${i<n?'✓':''}</b>${s}</div>`).join('')}</div>`;
const goals=(full)=>`<div class="gh"><div class="kick" style="justify-content:flex-start">حياة حنان</div><h2>أهداف حنان</h2></div><div class="cards">
 <div class="g" style="--ac:#6FE0D8">${full?'<span class="done">سلسلة ٧ أيام ✦</span>':''}<div class="tp"><span class="ap">الصحة واللياقة</span><span class="pl">عادة متكررة</span></div><h4>مشي ٣٠ دقيقة كل يوم</h4>${habit(full?7:3)}<div class="st"><span>هذا الأسبوع <b>${full?'٧/٧':'٣/٧'}</b></span><span>السلسلة <b>${full?'٧':'٣'}</b> أيام</span></div></div>
 <div class="g" style="--ac:#FFE36B">${full?'<span class="done">تحقق ✦</span>':''}<div class="tp"><span class="ap">المال والادخار</span><span class="pl">رقم أوصل له</span></div><h4>ادخار لمشروع جديد</h4><div class="num">${full?'٥٠٬٠٠٠':'١٨٬٠٠٠'} <small>/ ٥٠٬٠٠٠ ريال</small></div><div class="bar"><i style="width:${full?100:36}%"></i></div></div>
 <div class="g" style="--ac:#8FB8FF">${full?'<span class="done">تحقق ✦</span>':''}<div class="tp"><span class="ap">التعلّم والمهنة</span><span class="pl">خطوات ومراحل</span></div><h4>دورة تصوير احترافي</h4>${steps(full?4:2)}<div class="bar"><i style="width:${full?100:50}%"></i></div></div>
</div>`;
const scenes={
 '1':`<div class="c"><div class="serif big">كل حلم كبير…</div></div>`,
 '2':`<div class="c"><div class="serif big">يبدأ <span class="or">بخطوة</span></div><div class="line"></div><div class="serif mid" style="color:rgba(255,255,255,.75)">وخطة تمشي معك كل يوم</div></div>`,
 '3':goals(false),
 '4':goals(true),
 '5':`<div class="c"><div class="kick">سيدة الأعمال</div><div class="serif" style="font-size:78px;line-height:1.25;margin-top:6px">حنان المالكي</div><div class="hq"><img src="mbs.jpg" alt=""><p>«طموحنا عنان السماء»</p><cite>ولي العهد الأمير محمد بن سلمان</cite></div></div>`,
 '6':`<div class="c"><div class="logo">ح</div><div class="serif big" style="font-size:56px">رحلة أهداف <span class="or">جديدة</span></div><div class="serif mid" style="margin-top:6px">تبدأ الآن</div><div class="cta">تابعوني فيها ✦</div></div>`
};
document.getElementById('sc').innerHTML=scenes[S];
</script>
</body>
</html>
